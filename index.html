<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Tooth Protein</title>

<style>
:root{
  --bg:#050505;
  --panel:#0d0d0d;
  --panel2:#151515;
  --line:#2a2a2a;
  --text:#f3f3f3;
  --muted:#8d8d8d;
  --acid:#dfff00;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
    var(--bg);
  background-size:24px 24px;
  color:var(--text);
  padding-bottom:78px;
}

.top{
  border-bottom:1px solid var(--line);
  background:#070707;
  padding:22px 18px 18px;
}

.inner{
  max-width:760px;
  margin:auto;
}

.system{
  color:var(--acid);
  font-size:10px;
  letter-spacing:.24em;
  font-weight:800;
  margin-bottom:8px;
}

.logo{
  margin:0;
  font-size:36px;
  line-height:.9;
  letter-spacing:-.06em;
  text-transform:uppercase;
  font-weight:900;
}

.logo span{
  color:var(--acid);
}

.sub{
  margin:11px 0 0;
  color:var(--muted);
  font-size:13px;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:18px;
}

.hero{
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  border-left:5px solid var(--acid);
  padding:22px;
  overflow:hidden;
}

.hero:after{
  content:"";
  position:absolute;
  right:-22px;
  top:-22px;
  width:80px;
  height:80px;
  border:14px solid var(--acid);
  transform:rotate(45deg);
  opacity:.18;
}

.hero-code{
  color:var(--acid);
  font-size:10px;
  letter-spacing:.22em;
  font-weight:800;
}

.hero h2{
  margin:8px 0 8px;
  font-size:27px;
  text-transform:uppercase;
  letter-spacing:-.04em;
}

.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
  max-width:560px;
}

.section{
  display:flex;
  align-items:center;
  gap:10px;
  margin:26px 0 12px;
}

.section-line{
  width:34px;
  height:3px;
  background:var(--acid);
}

.section h3{
  margin:0;
  font-size:13px;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.mode{
  position:relative;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  min-height:128px;
  padding:16px;
  text-align:left;
  cursor:pointer;
  overflow:hidden;
}

.mode:hover{
  border-color:var(--acid);
}

.mode:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  height:4px;
  width:100%;
  background:transparent;
}

.mode:hover:before,
.mode.active:before{
  background:var(--acid);
}

.mode-number{
  color:var(--acid);
  font-size:10px;
  font-weight:800;
  letter-spacing:.18em;
  margin-bottom:18px;
}

.mode-title{
  margin:0 0 7px;
  font-size:16px;
  text-transform:uppercase;
  line-height:1.05;
  letter-spacing:-.02em;
}

.mode-copy{
  margin:0;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}

.corner{
  position:absolute;
  right:0;
  bottom:0;
  width:0;
  height:0;
  border-left:24px solid transparent;
  border-bottom:24px solid var(--acid);
  opacity:.18;
}

.search{
  width:100%;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line);
  border-left:4px solid var(--acid);
  border-radius:0;
  padding:15px;
  font-size:15px;
  outline:none;
}

.search:focus{
  border-color:var(--acid);
}

.result{
  margin-top:16px;
  background:var(--panel);
  border:1px solid var(--line);
  border-top:4px solid var(--acid);
  padding:18px;
}

.result h3{
  margin:0 0 10px;
  font-size:22px;
  text-transform:uppercase;
  letter-spacing:-.03em;
}

.meta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.tag{
  background:var(--panel2);
  border:1px solid #333;
  color:var(--acid);
  padding:6px 9px;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.result h4{
  color:var(--acid);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin:18px 0 8px;
}

.result ul{
  padding-left:20px;
}

.result li,
.result p{
  color:#d0d0d0;
  line-height:1.55;
}

.tip{
  margin-top:18px;
  padding:12px 14px;
  background:#090909;
  border-left:3px solid var(--acid);
  color:#cfcfcf;
  font-size:13px;
  line-height:1.5;
}

.nav{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#070707;
  border-top:1px solid var(--line);
  padding:10px 6px 12px;
}

.nav-item{
  text-align:center;
  color:#666;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.nav-item span{
  display:block;
  width:18px;
  height:3px;
  background:#333;
  margin:0 auto 7px;
}

.nav-item.active{
  color:#fff;
}

.nav-item.active span{
  background:var(--acid);
}

@media(max-width:520px){
  .logo{font-size:32px}
  .hero h2{font-size:24px}
  .mode-title{font-size:15px}
}
</style>
</head>

<body>

<header class="top">
  <div class="inner">
    <div class="system">HIGH PROTEIN DESSERT SYSTEM</div>
    <h1 class="logo">Sweet Tooth <span>Protein</span></h1>
    <p class="sub">Simple recipes. Useful nutrition. No nonsense.</p>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <div class="hero-code">CRAVING STATUS // ACTIVE</div>
    <h2>Select your mode</h2>
    <p>Tell us what kind of effort, time or dessert you have in mind. We'll narrow the options down.</p>
  </section>

  <div class="section">
    <div class="section-line"></div>
    <h3>Craving Modes</h3>
  </div>

  <div class="grid">

    <button class="mode active" data-type="cant">
      <div class="mode-number">01 // MINIMUM EFFORT</div>
      <h3 class="mode-title">I Can't Be Arsed</h3>
      <p class="mode-copy">Few ingredients. Minimal washing up. Still dessert.</p>
      <div class="corner"></div>
    </button>

    <button class="mode" data-type="quick">
      <div class="mode-number">02 // FAST RESPONSE</div>
      <h3 class="mode-title">15 Minutes or Less</h3>
      <p class="mode-copy">For cravings with absolutely no patience.</p>
      <div class="corner"></div>
    </button>

    <button class="mode" data-type="chocolate">
      <div class="mode-number">03 // CHOCOLATE</div>
      <h3 class="mode-title">Give Me Chocolate</h3>
      <p class="mode-copy">No explanation required.</p>
      <div class="corner"></div>
    </button>

    <button class="mode" data-type="cold">
      <div class="mode-number">04 // COLD SYSTEM</div>
      <h3 class="mode-title">Something Cold</h3>
      <p class="mode-copy">Ice cream, sorbet and frozen desserts.</p>
      <div class="corner"></div>
    </button>

    <button class="mode" data-type="chef">
      <div class="mode-number">05 // ADVANCED</div>
      <h3 class="mode-title">For Real Chefs</h3>
      <p class="mode-copy">You have time, patience and standards.</p>
      <div class="corner"></div>
    </button>

    <button class="mode" data-type="trust">
      <div class="mode-number">06 // EXPERIMENTAL</div>
      <h3 class="mode-title">Trust the Process</h3>
      <p class="mode-copy">The ingredient list may raise questions. Continue anyway.</p>
      <div class="corner"></div>
    </button>

    <button class="mode" data-type="surprise">
      <div class="mode-number">07 // RANDOM SELECT</div>
      <h3 class="mode-title">Surprise Me</h3>
      <p class="mode-copy">You've made enough decisions today.</p>
      <div class="corner"></div>
    </button>

    <button class="mode" data-type="browse">
      <div class="mode-number">08 // FULL DATABASE</div>
      <h3 class="mode-title">Browse Everything</h3>
      <p class="mode-copy">All recipes. No filtering. Have a nosey.</p>
      <div class="corner"></div>
    </button>

  </div>

  <div class="section">
    <div class="section-line"></div>
    <h3>Search Database</h3>
  </div>

  <input
    id="searchInput"
    class="search"
    type="text"
    placeholder="Chocolate, lemon, banana, mousse..."
  >

  <div id="recipeArea"></div>

</main>

<nav class="nav">
  <div class="nav-item active"><span></span>Home</div>
  <div class="nav-item"><span></span>Recipes</div>
  <div class="nav-item"><span></span>Saved</div>
  <div class="nav-item"><span></span>Search</div>
</nav>

<script>
const recipes = [
  {
    category:"cant",
    title:"Mega Quick Protein Brownie",
    time:"2 mins",
    effort:"Very easy",
    tags:["chocolate","brownie","quick"],
    ingredients:[
      "1 egg",
      "100g Greek yoghurt",
      "20g cocoa powder",
      "1 scoop whey protein",
      "20g sugar-free maple syrup"
    ],
    method:"Mix everything together until smooth, then microwave for 2 minutes.",
    tip:"Let it cool briefly. Molten brownie is delicious. Third-degree mouth burns are less useful."
  },

  {
    category:"quick",
    title:"Lemon Cheesecake Crunch",
    time:"5 mins",
    effort:"Very easy",
    tags:["lemon","cheesecake","quick"],
    ingredients:[
      "200g cottage cheese",
      "Zest of 1/2 lemon",
      "Juice of 1 lemon",
      "1 tsp vanilla extract",
      "1 scoop vanilla whey",
      "2 digestive biscuits"
    ],
    method:"Blend everything except the biscuits until smooth. Transfer to a bowl and crush the biscuits over the top.",
    tip:"A good example of a dessert that looks like considerably more effort than it actually was."
  },

  {
    category:"chocolate",
    title:"High Protein Chocolate Mousse",
    time:"5 mins + chill",
    effort:"Easy",
    tags:["chocolate","mousse","protein"],
    ingredients:[
      "400g cottage cheese",
      "60g cocoa powder",
      "60g maple syrup or honey",
      "3 scoops chocolate whey"
    ],
    method:"Blend everything until completely smooth, then refrigerate for 1 hour.",
    tip:"Blend it properly. Texture matters more than people think."
  },

  {
    category:"cold",
    title:"Quick Protein Ice Cream",
    time:"5 mins",
    effort:"Very easy",
    tags:["banana","ice cream","cold"],
    ingredients:[
      "2 frozen bananas",
      "200g cottage cheese",
      "1 scoop protein powder",
      "Splash of milk"
    ],
    method:"Blend everything in a food processor until smooth and creamy. Serve immediately.",
    tip:"Freeze the ingredients first rather than blending then freezing. You get a smoother result."
  },

  {
    category:"chef",
    title:"Protein Chocolate Soufflé",
    time:"15 mins",
    effort:"For real chefs",
    tags:["souffle","chocolate","chef"],
    ingredients:[
      "5 large egg whites",
      "1 whole egg",
      "1 scoop chocolate whey protein",
      "1 tbsp cocoa powder",
      "1 tsp coconut oil",
      "2 tbsp almond milk",
      "Pinch of salt"
    ],
    method:"Whisk the egg whites to soft peaks. Gently fold through the remaining ingredients. Fill ramekins and bake at 190°C for 12-15 minutes.",
    tip:"Fold gently. You spent time putting air into those egg whites. Don't immediately beat it back out."
  },

  {
    category:"trust",
    title:"Boiled Egg Chocolate Mousse",
    time:"5 mins + chill",
    effort:"Easy",
    tags:["chocolate","egg","mousse"],
    ingredients:[
      "4 hard-boiled eggs",
      "30g cocoa powder",
      "120ml milk",
      "30ml maple syrup",
      "Pinch of salt",
      "1 tsp vanilla extract"
    ],
    method:"Blitz everything in a food processor until completely smooth, then chill until set.",
    tip:"Yes, boiled eggs. The title was not a typo."
  }
];

const recipeArea=document.getElementById("recipeArea");
const searchInput=document.getElementById("searchInput");

function renderRecipe(recipe){
  const ingredients=recipe.ingredients.map(item=>`<li>${item}</li>`).join("");

  recipeArea.innerHTML=`
    <section class="result">
      <h3>${recipe.title}</h3>

      <div class="meta">
        <span class="tag">${recipe.time}</span>
        <span class="tag">${recipe.effort}</span>
      </div>

      <h4>Ingredients</h4>
      <ul>${ingredients}</ul>

      <h4>Method</h4>
      <p>${recipe.method}</p>

      <div class="tip">
        <strong>Technical note:</strong> ${recipe.tip}
      </div>
    </section>
  `;
}

function showRecipe(type){
  if(type==="surprise"){
    const random=recipes[Math.floor(Math.random()*recipes.length)];
    renderRecipe(random);
    return;
  }

  if(type==="browse"){
    recipeArea.innerHTML=recipes.map(recipe=>`
      <section class="result">
        <h3>${recipe.title}</h3>
        <div class="meta">
          <span class="tag">${recipe.time}</span>
          <span class="tag">${recipe.effort}</span>
        </div>
        <p>${recipe.method}</p>
      </section>
    `).join("");
    return;
  }

  const match=recipes.find(recipe=>recipe.category===type);
  if(match) renderRecipe(match);
}

document.querySelectorAll(".mode").forEach(button=>{
  button.addEventListener("click",()=>{
    document.querySelectorAll(".mode").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
    showRecipe(button.dataset.type);
  });
});

searchInput.addEventListener("input",()=>{
  const query=searchInput.value.toLowerCase().trim();

  if(!query){
    recipeArea.innerHTML="";
    return;
  }

  const matches=recipes.filter(recipe=>
    recipe.title.toLowerCase().includes(query) ||
    recipe.tags.some(tag=>tag.includes(query)) ||
    recipe.ingredients.some(item=>item.toLowerCase().includes(query))
  );

  if(!matches.length){
    recipeArea.innerHTML=`
      <section class="result">
        <h3>No Match Found</h3>
        <p>Either it isn't in the database yet or you've just invented recipe number 51.</p>
      </section>
    `;
    return;
  }

  recipeArea.innerHTML=matches.map(recipe=>`
    <section class="result">
      <h3>${recipe.title}</h3>
      <div class="meta">
        <span class="tag">${recipe.time}</span>
        <span class="tag">${recipe.effort}</span>
      </div>
      <p>${recipe.method}</p>
    </section>
  `).join("");
});
</script>

</body>
</html>
